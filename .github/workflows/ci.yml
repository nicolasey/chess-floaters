name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      # The published artifact is what consumers resolve, and noEmit never
      # produces it. A declaration emit that breaks would otherwise surface at
      # publish time.
      - run: bun run build
